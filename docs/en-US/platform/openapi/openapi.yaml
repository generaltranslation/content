      responses:
        '200':
          description: CLI wizard session credentials.
          content:
            application/json:
              schema:
                type: object
                required: [projectId]
                properties:
                  apiKey:
                    type: string
                    description: Returned by API versions before 2026-03-06.v1.
                  apiKeys:
                    type: array
                    description: Returned by API version 2026-03-06.v1 and later.
                    items:
                      type: object
                      required: [key, type]
                      properties:
                        key: { type: string }
                        type:
                          type: string
                          enum: [development, production]
                  projectId: { type: string }
        '202':
          description: CLI wizard session is waiting for sign-in.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [CLI Wizard]
      summary: Delete a CLI wizard session
      description: Delete an unauthenticated CLI sign-in session.
      operationId: deleteCliWizardSession
      security: []
      parameters:
        - $ref: '#/components/parameters/GtApiVersion'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: CLI wizard session deleted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: >
        API key sent as a bearer token in the standard `Authorization: Bearer
        <key>` header. Use a project key (`gtx-api-`, `gtx-dev-`) or an
        organization key (`gtx-org-`). Organization keys must also send
        `gt-project-id` on project-scoped routes. Organization-scoped routes
        derive the organization from the key and do not use `gt-project-id`.

  parameters:
    GtApiVersion:
      name: gt-api-version
      in: header
      required: false
      description: >
        API version. Defaults to the earliest supported version. Latest is
        `2026-03-06.v1`.
      schema:
        type: string
        enum:
          - '2025-01-01.v0'
          - '2025-11-03.v1'
          - '2026-02-18.v1'
          - '2026-03-06.v1'
    GtProjectId:
      name: gt-project-id
      in: header
      required: false
      description: Target project ID. Required when authenticating with an organization API key.
      schema:
        type: string

  schemas:
    FileFormat:
      type: string
      description: Supported file format. Request values are case-insensitive.
      enum:
        - GTJSON
        - MDX
        - JSON
        - YAML
        - MD
        - TS
        - JS
        - HTML
        - TXT
        - PO
        - POT
        - TWILIO_CONTENT_JSON
        - LOTTIE
        - SVG
    RuntimeTranslationResponse:
      type: object
      additionalProperties:
        type: object
        required: [success]
        properties:
          success: { type: boolean }
          translation:
            type: [string, object, array, number, boolean, 'null']
            description: Translated content in the requested data format.
          dataFormat:
            type: string
            enum: [JSX, ICU, I18NEXT, STRING]
          locale: { type: string }
          error: { type: string }
          code: { type: number }
    SourceFileInput:
      type: object
      required: [content, fileName, fileFormat, locale]
      properties:
        content:
          type: string
          description: Base64-encoded file content.
        fileName: { type: string }
        fileFormat:
          $ref: '#/components/schemas/FileFormat'
        dataFormat:
          type: string
          description: Data format, e.g. STRING, JSX, ICU.
        locale:
          type: string
          description: Source locale code.
        fileId:
          type: string
          description: Derived from the file name when omitted.
        versionId:
          type: string
          description: Derived from the content hash when omitted.
        branchId:
          type: string
          description: Defaults to the default branch.
        checkedOutBranchId: { type: string }
        incomingBranchId: { type: string }
        formatMetadata:
          type: object
          additionalProperties: true
    Branch:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
    PlainTextError:
      type: string
      description: Human-readable error message.

  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    Forbidden:
      description: The API key lacks the required permission, or the action is not allowed on the current plan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    RateLimited:
      description: Rate limit or quota exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    PaymentRequired:
      description: Payment or quota validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    PayloadTooLarge:
      description: The request body exceeds the endpoint limit.
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    TooEarly:
      description: The requested translation is still processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
    ServiceUnavailable:
      description: The server is temporarily busy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/html:
          schema:
            $ref: '#/components/schemas/PlainTextError'
