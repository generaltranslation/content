  /cli/wizard/{sessionId}:
    get:
      tags: [CLI Wizard]
      summary: Get a CLI wizard session
      description: >
        Return credentials when sign-in completes, or a waiting response while
        the session is pending. Version 2026-03-06.v1 returns `apiKeys`; earlier
