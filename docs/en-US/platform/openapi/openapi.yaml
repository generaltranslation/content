  /v2/translate:
    post:
      tags: [Translation]
      summary: Translate content at runtime
      description: >
        Translate one or more strings or structured content entries with caching
        and memoization. Requires an API key with
        `project:translations:generate`; development keys are accepted.
      operationId: translate
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/GtApiVersion'
        - $ref: '#/components/parameters/GtProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests, targetLocale, sourceLocale, metadata]
              properties:
                requests:
                  type: object
                  minProperties: 1
                  description: Map of request key to a translation request entry.
                  additionalProperties:
                    type: object
                    required: [source]
                    properties:
                      source:
                        description: String, JSX, ICU, or i18next content to translate.
                      metadata:
                        type: object
                        properties:
                          id: { type: string }
                          hash: { type: string }
                          context: { type: string }
                          maxChars:
                            type: number
                            description: >
                              Requested maximum translation length. Only positive
                              integers apply a character limit; other numeric
                              values are ignored.
                          dataFormat:
                            type: string
                            enum: [STRING, JSX, ICU, I18NEXT]
                            default: STRING
                          actionType:
                            type: string
                            default: fast
                          sourceCode:
                            type: object
                            additionalProperties:
                              type: array
                              maxItems: 5
                              items:
                                type: object
                                required: [before, target, after]
                                properties:
                                  before:
                                    type: string
                                    description: Truncated to 2,000 characters before translation.
                                  target:
                                    type: string
                                    description: Truncated to 500 characters before translation.
                                  after:
                                    type: string
                                    description: Truncated to 2,000 characters before translation.
                targetLocale:
                  type: string
                  minLength: 1
                sourceLocale:
                  type: string
                  minLength: 1
                metadata:
                  type: object
                  properties:
                    modelProvider:
                      type: string
                      enum: [ANTHROPIC, OPENAI, XAI, GOOGLE]
      responses:
        '200':
          description: Cached or partially completed translation results, keyed by request key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeTranslationResponse'
        '201':
          description: Translation results, keyed by request key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeTranslationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }

